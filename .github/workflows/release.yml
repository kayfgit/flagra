# Push a tag like v0.1.0 (matching "version" in tauri.conf.json) to publish a release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tauri.conf.json says $version but the tag is $env:GITHUB_REF_NAME"
          }

      - name: Fetch the bundled ffmpeg
        shell: pwsh
        run: ./ffmpeg/fetch.ps1

      - name: Test
        run: cargo test

      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build --config tauri.bundle.conf.json

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          # Stable names, so install.ps1 and README links can use releases/latest/download/…
          Copy-Item "target/release/bundle/nsis/flagra_${version}_x64-setup.exe" flagra-setup.exe
          # Portable: flagra.exe with its ffmpeg folder next to it, laid out like an install.
          New-Item -ItemType Directory -Force portable/ffmpeg | Out-Null
          Copy-Item target/release/flagra.exe portable/
          Copy-Item ffmpeg/dist/ffmpeg.exe, ffmpeg/dist/README.txt portable/ffmpeg/
          Copy-Item ffmpeg/dist/COPYING.GPLv2 portable/ffmpeg/COPYING.GPLv2.txt
          Compress-Archive portable/* flagra-portable.zip
          $notes = @"
          ## Install

          Paste into PowerShell. It installs for your user (no admin) and starts flagra:

          ``````powershell
          irm https://raw.githubusercontent.com/kayfgit/flagra/main/install.ps1 | iex
          ``````

          Or download **flagra-setup.exe** below, or **flagra-portable.zip** to run it from any folder without installing.
          Both come with the ffmpeg flagra needs. Then press **Alt+F10** to save the last 20 seconds.
          "@
          gh release create $tag flagra-setup.exe flagra-portable.zip --title "flagra $tag" --notes $notes
