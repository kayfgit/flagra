<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>flagra</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body class="clips">
  <header id="top" data-tauri-drag-region>
    <span id="rec" data-tauri-drag-region></span>
    <span id="usage" data-tauri-drag-region></span>
    <span id="winctl">
      <button id="min" tabindex="-1" title="Minimize" aria-label="Minimize">─</button>
      <button id="close" tabindex="-1" title="Close (Esc) · recording continues" aria-label="Close">✕</button>
    </span>
  </header>

  <main id="view">
    <section id="player" hidden>
      <video id="video" preload="metadata"></video>
      <div id="playbar"><span id="clock"></span><span id="playname"></span></div>
    </section>
    <ol id="list" aria-label="Clips"></ol>
    <div id="help" hidden></div>
  </main>

  <section id="live" hidden>
    <span id="prompt" class="gutter">:</span>
    <input id="input" spellcheck="false" autocomplete="off" aria-label="Command">
    <div id="preview"></div>
  </section>

  <footer data-tauri-drag-region>
    <button id="mode" tabindex="-1" title="Clips / settings (Tab)"></button>
    <span id="info" role="status" data-tauri-drag-region></span>
    <span id="hints" data-tauri-drag-region></span>
  </footer>
</body>
</html>
